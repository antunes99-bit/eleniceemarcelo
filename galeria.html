<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — Elenice & Marcelo Dança de Salão</title>
<meta name="description" content="Fotos e vídeos das turmas, eventos e apresentações da escola de dança de salão Elenice & Marcelo, em Pelotas/RS.">
<link id="favicon" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{--wine:#6e1d2c;--wine-dark:#511320;--gold:#c79a4b;--gold-soft:#e3c98a;--cream:#faf5ee;--cream-2:#f3e9db;--ink:#2a1c1f;--muted:#7a6a63;--shadow:0 18px 50px -20px rgba(46,16,24,.45);--radius:18px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px;width:100%}
  header{background:rgba(250,245,238,.95);border-bottom:1px solid var(--cream-2);position:sticky;top:0;z-index:10}
  nav{display:flex;align-items:center;justify-content:space-between;height:74px;max-width:1140px;margin:0 auto;padding:0 22px}
  .brand{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.32rem;color:var(--wine);display:flex;align-items:center;gap:.7rem}
  .brand span{color:var(--gold)}
  .brand img{height:52px;width:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold)}
  .back{font-weight:600;color:var(--wine);font-size:.92rem;padding:.5rem 1.1rem;border:1.5px solid var(--cream-2);border-radius:999px;transition:.2s;white-space:nowrap}
  .back:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
  .hero{background:linear-gradient(135deg,var(--wine-dark),var(--wine) 60%,#7e2535);color:#fff;padding:46px 0 40px;text-align:center}
  .eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;font-weight:700;color:var(--gold-soft)}
  .hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.8rem,5vw,2.8rem);margin:.4rem 0}
  .hero p{color:rgba(255,255,255,.85);font-size:.95rem}
  main{flex:1;padding:36px 0 64px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
  .chip{padding:.45rem 1rem;border-radius:999px;border:1.5px solid var(--cream-2);background:#fff;font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s}
  .chip.active,.chip:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
  .albums{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .folder{display:block;border-radius:14px;overflow:hidden;background:#3a0f1a;box-shadow:var(--shadow);transition:.25s;position:relative;cursor:pointer}
  .folder:hover{transform:translateY(-5px)}
  .folder-img{aspect-ratio:4/3;overflow:hidden;position:relative}
  .folder-img img,.folder-img video{width:100%;height:100%;object-fit:cover;transition:.4s;display:block}
  .folder:hover .folder-img img,.folder:hover .folder-img video{transform:scale(1.07)}
  .folder-info{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 13px;background:linear-gradient(transparent,rgba(40,8,16,.55) 40%,rgba(40,8,16,.92));color:#fff}
  .folder-name{display:block;font-family:'Playfair Display',Georgia,serif;font-size:1.05rem;font-weight:700;line-height:1.25}
  .folder-count{font-size:.75rem;color:var(--gold-soft);letter-spacing:.04em}
  .vidbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .vidbadge::after{content:'▶';color:#fff;font-size:1.1rem;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding-left:3px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .ph-item{aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative;box-shadow:var(--shadow);transition:.2s;background:#3a0f1a}
  .ph-item:hover{transform:scale(1.04)}
  .ph-item img,.ph-item video{width:100%;height:100%;object-fit:cover;display:block}
  .ph-item .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .ph-item .play span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;padding-left:3px}
  .empty{text-align:center;color:var(--muted);font-style:italic;padding:50px 10px}
  footer{background:var(--wine-dark);color:rgba(255,255,255,.8);text-align:center;padding:30px 0;font-size:.85rem}
  footer .gold{color:var(--gold-soft)}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(20,6,11,.94);display:none;align-items:center;justify-content:center;padding:20px}
  .lightbox.open{display:flex}
  .lb-content img,.lb-content video{max-width:92vw;max-height:82vh;border-radius:12px;box-shadow:0 30px 80px -20px #000;display:block;background:#000}
  .lb-close{position:absolute;top:18px;right:24px;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer;line-height:1;z-index:2}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:0;color:#fff;font-size:1.6rem;width:46px;height:46px;border-radius:50%;cursor:pointer;z-index:2}
  .lb-prev{left:14px}.lb-next{right:14px}
  .lb-cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-weight:600;padding:0 60px}
  @media(max-width:900px){.albums{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <nav>
    <a href="index.html" class="brand" id="brand">Elenice <span>&amp;</span> Marcelo</a>
    <a href="#" class="back" id="backBtn">← Voltar</a>
  </nav>
</header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow">O salão em movimento</div>
    <h1 id="pageTitle">Galeria</h1>
    <p id="pageSub"></p>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="chips" id="chips" style="display:none"></div>
    <div id="content"><div class="empty">Carregando…</div></div>
  </div>
</main>

<footer>
  <div class="wrap"><strong class="gold">Elenice &amp; Marcelo</strong> · Dança de Salão · Pelotas/RS</div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Fechar">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior">‹</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Próxima">›</button>
  <div class="lb-content" id="lbContent"></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
const CATS={destaque:'Destaque',alunos:'Alunos',eventos:'Eventos',aulas:'Aulas',praticas:'Práticas',apresentacoes:'Apresentações',coreografias:'Coreografias',festivais:'Festivais'};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
let ALBUMS=[], CURRENT=[], LBIDX=0;

async function getJSON(p,f){try{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw 0;return await r.json();}catch(e){return f;}}

/* ------- lightbox com navegação ------- */
const lb=$('lightbox'),lbContent=$('lbContent'),lbCap=$('lbCap');
function openLB(items,i){CURRENT=items;LBIDX=i;renderLB();lb.classList.add('open');document.body.style.overflow='hidden';}
function renderLB(){
  const m=CURRENT[LBIDX];if(!m)return;
  lbContent.innerHTML=m.video?'<video src="'+m.url+'" controls autoplay playsinline></video>':'<img src="'+m.url+'" alt="">';
  lbCap.textContent=m.legenda||'';
  $('lbPrev').style.display=$('lbNext').style.display=CURRENT.length>1?'block':'none';
}
function closeLB(){lb.classList.remove('open');lbContent.innerHTML='';document.body.style.overflow='';}
$('lbClose').onclick=closeLB;
$('lbPrev').onclick=e=>{e.stopPropagation();LBIDX=(LBIDX-1+CURRENT.length)%CURRENT.length;renderLB();};
$('lbNext').onclick=e=>{e.stopPropagation();LBIDX=(LBIDX+1)%CURRENT.length;renderLB();};
lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft')$('lbPrev').click();
  if(e.key==='ArrowRight')$('lbNext').click();
});

/* ------- telas ------- */
function mediaTag(m,lazy){
  return m.video
    ? '<video src="'+m.url+'" muted playsinline preload="metadata"></video><div class="play"><span>▶</span></div>'
    : '<img src="'+m.url+'" alt="'+esc(m.legenda)+'"'+(lazy?' loading="lazy"':'')+'>';
}
function coverTag(a){
  const cov=a.capa||((a.media[0]||{}).url)||'';
  const isV=/\.(mp4|webm|ogg|m4v|mov)$/i.test(cov);
  return isV?'<video src="'+cov+'" muted playsinline preload="metadata"></video><span class="vidbadge"></span>':'<img src="'+cov+'" alt="'+esc(a.titulo)+'" loading="lazy">';
}
const CATORDER=['destaque','alunos','eventos','aulas','praticas','apresentacoes','coreografias','festivais'];
function showCategories(){
  // nível 1: uma pasta por categoria
  const groups={};
  ALBUMS.filter(a=>a.media.length).forEach(a=>{const c=a.categoria||'eventos';(groups[c]=groups[c]||[]).push(a);});
  let order=CATORDER.filter(c=>groups[c]);
  Object.keys(groups).forEach(c=>{if(!order.includes(c))order.push(c);});
  $('pageTitle').textContent='Galeria';
  $('pageSub').textContent=order.length?order.length+(order.length>1?' categorias':' categoria'):'';
  $('backBtn').textContent='← Voltar ao site';$('backBtn').href='index.html#galeria';
  $('chips').style.display='none';
  document.title='Galeria — Elenice & Marcelo Dança de Salão';
  if(!order.length){$('content').innerHTML='<div class="empty">Ainda não há fotos e vídeos.</div>';return;}
  $('content').innerHTML='<div class="albums">'+order.map(c=>{
    const albs=groups[c]; const total=albs.reduce((s,a)=>s+a.media.length,0);
    const first=albs[0]; const cover={capa:first.capa,media:first.media,titulo:CATS[c]||c};
    return '<a class="folder" href="galeria.html?cat='+encodeURIComponent(c)+'"><div class="folder-img">'+coverTag(cover)+'</div><div class="folder-info"><span class="folder-name">'+esc(CATS[c]||c)+'</span><span class="folder-count">'+total+(total>1?' itens':' item')+(albs.length>1?' · '+albs.length+' pastas':'')+'</span></div></a>';
  }).join('')+'</div>';
}
function showAlbums(cat){
  // nível 2: subpastas (lotes) da categoria
  const list=ALBUMS.filter(a=>a.media.length&&a.categoria===cat);
  if(!list.length){showCategories();return;}
  if(list.length===1){showAlbum(list[0].id,cat);return;} // só uma pasta → abre direto
  $('pageTitle').textContent=CATS[cat]||cat;
  $('pageSub').textContent=list.length+' pastas';
  $('backBtn').textContent='← Categorias';$('backBtn').href='galeria.html';
  $('chips').style.display='none';
  document.title=(CATS[cat]||cat)+' — Elenice & Marcelo Dança de Salão';
  $('content').innerHTML='<div class="albums">'+list.map(a=>
    '<a class="folder" href="galeria.html?album='+encodeURIComponent(a.id)+'"><div class="folder-img">'+coverTag(a)+'</div><div class="folder-info"><span class="folder-name">'+esc(a.titulo)+'</span><span class="folder-count">'+a.media.length+(a.media.length>1?' itens':' item')+'</span></div></a>'
  ).join('')+'</div>';
}
function showAlbum(id,fromCat){
  const a=ALBUMS.find(x=>x.id===id);
  if(!a){showCategories();return;}
  const siblings=ALBUMS.filter(x=>x.media.length&&x.categoria===a.categoria).length;
  $('pageTitle').textContent=a.titulo;
  $('pageSub').textContent=(CATS[a.categoria]||a.categoria)+' · '+a.media.length+(a.media.length>1?' itens':' item');
  if(fromCat||siblings<=1){$('backBtn').textContent='← Categorias';$('backBtn').href='galeria.html';}
  else{$('backBtn').textContent='← '+(CATS[a.categoria]||a.categoria);$('backBtn').href='galeria.html?cat='+encodeURIComponent(a.categoria);}
  $('chips').style.display='none';
  document.title=a.titulo+' — Elenice & Marcelo Dança de Salão';
  const items=a.media.map(m=>({...m,legenda:m.legenda||a.titulo}));
  $('content').innerHTML='<div class="grid">'+items.map((m,i)=>'<div class="ph-item" data-i="'+i+'">'+mediaTag(m,true)+'</div>').join('')+'</div>';
  $('content').querySelectorAll('.ph-item').forEach(el=>el.onclick=()=>openLB(items,parseInt(el.dataset.i,10)));
}

async function load(){
  const info=await getJSON('content/info.json',{});
  if(info.logo){
    $('brand').innerHTML='<img src="'+info.logo+'" alt="Elenice & Marcelo"><span style="font-family:\'Playfair Display\',Georgia,serif;color:var(--wine)">Elenice <em style="color:var(--gold);font-style:normal">&amp;</em> Marcelo</span>';
    $('favicon').href=info.logo;
  }
  const data=await getJSON('/api/galeria',{albums:[]});
  ALBUMS=(data.albums||[]).slice().reverse(); // mais novos primeiro
  const p=new URLSearchParams(location.search);
  if(p.get('album'))showAlbum(p.get('album'));
  else if(p.get('cat'))showAlbums(p.get('cat'));
  else showCategories();
}
load();
</script>
</body>
</html>
