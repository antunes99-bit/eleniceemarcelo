<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alunos — Elenice & Marcelo</title>
<meta name="robots" content="noindex, nofollow">
<link id="favicon" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--wine:#6e1d2c;--wine-dark:#511320;--gold:#c79a4b;--gold-soft:#e3c98a;--cream:#faf5ee;--cream-2:#f3e9db;--ink:#2a1c1f;--muted:#7a6a63;--ok:#2e7d32;--err:#c62828;--radius:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:20px 14px 60px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto}
  .logo{display:block;margin:0 auto;height:64px;width:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
  h1{font-family:'Playfair Display',Georgia,serif;color:var(--wine);font-size:1.6rem;text-align:center;margin:12px 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:20px}
  .card{background:#fff;border:1px solid var(--cream-2);border-radius:var(--radius);box-shadow:0 14px 40px -18px rgba(46,16,24,.35);padding:20px;margin-bottom:14px}
  label{display:block;font-weight:700;font-size:.86rem;margin:0 0 5px}
  input,select{width:100%;padding:.7rem .9rem;border:1.5px solid var(--cream-2);border-radius:10px;font:inherit;background:var(--cream)}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .fila{display:flex;gap:10px;flex-wrap:wrap}
  .fila>div{flex:1;min-width:150px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .stat{background:var(--cream-2);border-radius:999px;padding:.35rem .9rem;font-size:.78rem;font-weight:700;color:var(--wine)}
  .btn{padding:.6rem 1.1rem;border:0;border-radius:999px;background:var(--wine);color:#fff;font:inherit;font-size:.88rem;font-weight:700;cursor:pointer}
  .btn.sec{background:var(--cream-2);color:var(--wine)}
  .aluno{border:1px solid var(--cream-2);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .al-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--cream)}
  .al-head .t{flex:1;min-width:0}
  .al-head .t b{display:block;font-size:.95rem}
  .al-head .t small{color:var(--muted);font-size:.76rem}
  .tag{font-size:.68rem;font-weight:800;padding:.2rem .65rem;border-radius:999px;color:#fff;flex-shrink:0}
  .tag.novo{background:var(--gold)} .tag.confirmado{background:var(--ok)} .tag.inativo{background:#9e9e9e}
  .al-body{padding:12px 14px;border-top:1px solid var(--cream-2);display:none;font-size:.86rem}
  .al-body dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
  .al-body dt{font-weight:700;color:var(--muted)}
  .al-body dd{word-break:break-word}
  .al-body dd .ed{background:none;border:0;cursor:pointer;font-size:.85rem;opacity:.55;margin-left:4px}
  .al-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .al-acts button,.al-acts a{font:inherit;font-size:.76rem;font-weight:700;border:0;border-radius:999px;padding:.45rem .8rem;cursor:pointer;background:var(--cream-2);color:var(--wine);text-decoration:none}
  .al-acts .del{background:#ffebee;color:var(--err)}
  .al-acts .wa{background:#25d366;color:#fff}
  .empty{text-align:center;color:var(--muted);font-style:italic;padding:30px 10px}
  .msg{margin-top:10px;text-align:center;font-weight:600;display:none;padding:.7rem;border-radius:10px}
  .msg.err{display:block;background:#ffebee;color:var(--err)}
  .back{display:block;text-align:center;margin-top:20px;color:var(--wine);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" id="logo" alt="" style="display:none">
  <h1>Alunos matriculados</h1>
  <p class="sub">Área restrita da escola. Link de matrícula: <b>eleniceemarcelo.com.br/matricula</b></p>

  <div class="card">
    <div class="fila">
      <div><label for="chave">Senha</label><input type="password" id="chave" placeholder="Senha de publicação"></div>
      <div style="flex:0;align-self:flex-end"><button class="btn" id="entrar">Entrar</button></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="painel" style="display:none">
    <div class="card">
      <div class="fila">
        <div><label>Filtrar por turma</label><select id="fTurma"><option value="">Todas as turmas</option></select></div>
        <div><label>Buscar por nome</label><input type="text" id="fBusca" placeholder="Digite um nome…"></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="fila" style="margin-top:8px">
        <button class="btn sec" id="exportar">⬇️ Exportar Excel (CSV)</button>
        <button class="btn sec" id="atualizar">🔄 Atualizar</button>
      </div>
    </div>
    <div id="lista"></div>
  </div>

  <a class="back" href="/">← Voltar ao site</a>
</div>

<script>
const $=id=>document.getElementById(id);
let ALUNOS=[];
const ROTULOS={nome:'Nome',cpf:'CPF',nascimento:'Nascimento',whatsapp:'WhatsApp',email:'E-mail',endereco:'Endereço',turma:'Turma',emergencia_nome:'Emergência (nome)',emergencia_fone:'Emergência (fone)',saude:'Saúde',cobranca_nome:'Cobrança (nome)',cobranca_email:'Cobrança (e-mail)',cobranca_whatsapp:'Cobrança (WhatsApp)',criado:'Cadastrado em',status:'Status'};

fetch('/content/info.json').then(r=>r.json()).then(i=>{if(i.logo){$('logo').src=i.logo;$('logo').style.display='block';$('favicon').href=i.logo;}}).catch(()=>{});

$('chave').value=localStorage.getItem('pubkey')||'';
const chave=()=>$('chave').value.trim();
function showMsg(t){const m=$('msg');m.textContent=t;m.className='msg err';setTimeout(()=>m.className='msg',4000);}

async function carregar(){
  if(!chave()){showMsg('Digite a senha.');return;}
  const r=await fetch('/api/alunos?chave='+encodeURIComponent(chave())+'&cb='+Date.now());
  const j=await r.json().catch(()=>({}));
  if(!r.ok){showMsg(j.error||'Erro ao carregar.');return;}
  localStorage.setItem('pubkey',chave());
  ALUNOS=j.alunos||[];
  $('painel').style.display='block';
  montaFiltros();render();
}
$('entrar').onclick=carregar;
$('atualizar').onclick=carregar;
if($('chave').value)carregar();

function montaFiltros(){
  const turmas=[...new Set(ALUNOS.flatMap(a=>String(a.turma||'').split(' | ')).filter(Boolean))].sort();
  const sel=$('fTurma');const atual=sel.value;
  sel.innerHTML='<option value="">Todas as turmas</option>'+turmas.map(t=>'<option>'+esc(t)+'</option>').join('');
  sel.value=atual||'';
}
$('fTurma').onchange=render;
$('fBusca').oninput=render;

function filtrados(){
  const t=$('fTurma').value,b=$('fBusca').value.trim().toLowerCase();
  return ALUNOS.filter(a=>(!t||String(a.turma||'').split(' | ').includes(t))&&(!b||(a.nome||'').toLowerCase().includes(b)));
}
const esc=s=>('' + (s??'')).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function render(){
  const list=filtrados();
  const porStatus=s=>ALUNOS.filter(a=>a.status===s).length;
  $('stats').innerHTML='<span class="stat">'+ALUNOS.length+' aluno'+(ALUNOS.length===1?'':'s')+'</span>'
    +'<span class="stat">'+porStatus('novo')+' novos</span>'
    +'<span class="stat">'+porStatus('confirmado')+' confirmados</span>'
    +($('fTurma').value?'<span class="stat">'+list.length+' no filtro</span>':'');
  const box=$('lista');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="card empty">Nenhum aluno '+(ALUNOS.length?'neste filtro':'cadastrado ainda — compartilhe o link de matrícula!')+'</div>';return;}
  const wrap=document.createElement('div');wrap.className='card';
  list.forEach(a=>wrap.appendChild(linha(a)));
  box.appendChild(wrap);
}

function linha(a){
  const d=document.createElement('div');d.className='aluno';
  const st=a.status||'novo';
  d.innerHTML='<div class="al-head"><div class="t"><b>'+esc(a.nome)+'</b><small>'+esc(a.turma||'—')+'</small></div><span class="tag '+esc(st)+'">'+esc(st)+'</span><span>▾</span></div><div class="al-body"></div>';
  const body=d.querySelector('.al-body');
  const head=d.querySelector('.al-head');
  head.onclick=()=>{
    if(body.style.display==='block'){body.style.display='none';return;}
    body.style.display='block';
    if(body.dataset.pronto)return;
    body.dataset.pronto='1';
    const dl=document.createElement('dl');
    ['cpf','whatsapp','email','nascimento','endereco','turma','cobranca_nome','cobranca_email','cobranca_whatsapp','emergencia_nome','emergencia_fone','saude','criado'].forEach(c=>{
      const dt=document.createElement('dt');dt.textContent=ROTULOS[c];
      const dd=document.createElement('dd');
      dd.textContent=c==='criado'?String(a[c]||'').slice(0,10):(a[c]||'—');
      if(c!=='criado'){
        const ed=document.createElement('button');ed.className='ed';ed.textContent='✏️';ed.title='Editar';
        ed.onclick=async ev=>{ev.stopPropagation();
          const novo=prompt('Editar '+ROTULOS[c]+':',a[c]||'');
          if(novo===null)return;
          if(await api('editar',{id:a.id,campo:c,valor:novo.trim()})){a[c]=novo.trim();dd.firstChild.textContent=a[c]||'—';}
        };
        dd.append(ed);
      }
      dl.append(dt,dd);
    });
    body.appendChild(dl);
    const acts=document.createElement('div');acts.className='al-acts';
    const wa=document.createElement('a');wa.className='wa';wa.textContent='💬 WhatsApp';wa.target='_blank';wa.rel='noopener';
    wa.href='https://wa.me/55'+String(a.whatsapp||'').replace(/\D/g,'').replace(/^55/,'');
    const bSt=document.createElement('button');bSt.textContent='✔️ Status';
    bSt.onclick=async()=>{
      const ordem=['novo','confirmado','inativo'];
      const prox=ordem[(ordem.indexOf(a.status||'novo')+1)%ordem.length];
      if(await api('status',{id:a.id,status:prox})){a.status=prox;render();}
    };
    const bDel=document.createElement('button');bDel.className='del';bDel.textContent='🗑️ Excluir';
    bDel.onclick=async()=>{
      if(!confirm('Excluir o cadastro de "'+a.nome+'"? Não dá pra desfazer.'))return;
      const r=await fetch('/api/alunos?chave='+encodeURIComponent(chave())+'&id='+a.id,{method:'DELETE'});
      if(r.ok){ALUNOS=ALUNOS.filter(x=>x.id!==a.id);montaFiltros();render();}else showMsg('Erro ao excluir.');
    };
    acts.append(wa,bSt,bDel);
    body.appendChild(acts);
  };
  return d;
}

async function api(modo,fields){
  const fd=new FormData();fd.set('chave',chave());
  Object.entries(fields).forEach(([k,v])=>fd.set(k,v));
  const r=await fetch('/api/alunos?modo='+modo,{method:'POST',body:fd});
  if(!r.ok){const j=await r.json().catch(()=>({}));showMsg(j.error||'Erro.');return false;}
  return true;
}

$('exportar').onclick=()=>{
  const cols=['nome','cpf','nascimento','whatsapp','email','endereco','turma','status','cobranca_nome','cobranca_email','cobranca_whatsapp','emergencia_nome','emergencia_fone','saude','criado'];
  const linhas=[cols.map(c=>ROTULOS[c]).join(';')];
  filtrados().forEach(a=>linhas.push(cols.map(c=>'"'+String(a[c]||'').replace(/"/g,'""')+'"').join(';')));
  const blob=new Blob(['﻿'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const el=document.createElement('a');el.href=url;el.download='alunos-eleniceemarcelo.csv';el.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
};
</script>
</body>
</html>
